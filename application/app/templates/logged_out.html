{% extends "base.html" %}

{% block content %}
<div class="row is-center landing">
    <div class="col-12 col-8-md card">
        <header>
            <h3>Session terminée</h3>
        </header>
        {% if expired %}
        <p>Votre session a expiré après {{ minutes }} minutes d'inactivité</p>
        {% else %}
        <p>Vous êtes déconnecté</p>
        {% endif %}
        <div class="actions">
            <a class="button primary" href="/login">Se reconnecter</a>
        </div>
    </div>
</div>
{% endblock %}
