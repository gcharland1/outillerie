{% extends "base.html" %}

{% block content %}
<div class="row is-center">
    <div class="col-12 col-8-md card">
        <header>
            <h3>Retirer {{ contact.first_name }} {{ contact.last_name }} ({{ contact.username }}) de vos contacts ?</h3>
        </header>
        <p>Vous ne figurerez plus non plus dans ses contacts. Vous pourrez lui envoyer une nouvelle demande plus tard.</p>
        <form action="{{ url_for('contacts.remove', user_id=contact.id) }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="actions">
                <a class="button" href="{{ url_for('contacts.mine') }}">Annuler</a>
                <button type="submit" class="button error">Retirer</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
