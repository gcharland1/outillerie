{% extends "base.html" %}

{% block content %}
    <h2>Mes outils retirés</h2>
    <div class="actions page-actions">
        <a class="button" href="{{ url_for('tools.mine') }}">Retour à mes outils</a>
    </div>
{% if tools %}
    <table>
        <thead>
            <tr><th>Nom</th><th>État</th><th></th></tr>
        </thead>
        <tbody>
        {% for tool in tools %}
            <tr>
                <td>{{ tool.name }}</td>
                <td>{{ condition_labels[tool.condition] }}</td>
                <td>
                    <form class="actions" action="{{ url_for('tools.restore', tool_id=tool.id) }}" method="post">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit" class="button primary">Remettre en circulation</button>
                    </form>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
{% else %}
    <p>Aucun outil retiré</p>
{% endif %}
{% endblock %}
