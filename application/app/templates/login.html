{% extends "base.html" %}

{% block content %}
<div class="row is-center landing">
    <div class="col-12 col-8-md card">
        <header>
            <h3>Connexion</h3>
        </header>
        <form action="/login" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row">
                <div class="col-6">
                    <label for="email">Courriel:</label>
                    <input type="email" name="email" id="email" value="{{ email }}" autocomplete="username" required />
                </div>
                <div class="col-6">
                    <label for="password">Mot de passe:</label>
                    <input type="password" name="password" required />
                </div>
            </div>
            <label class="checkbox">
                <input type="checkbox" name="remember" value="1"{% if remember %} checked{% endif %} />
                Rester connecté sur cet appareil
            </label>
            <div class="actions">
                <button type="submit" class="button primary">Se connecter</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
