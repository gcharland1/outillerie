[project]
name = "outillerie"
version = "0.1.0"
description = "Site communautaire de partage d'outils entre voisins"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask",
    "flask_sqlalchemy",
    "flask_login",
    "flask_migrate",
    "werkzeug",
    "python-dotenv>=1.2.4",
    "psycopg[binary]>=3.3.6",
    "flask-wtf>=1.3.0",
]

[dependency-groups]
dev = [
    "paracelsus>=0.15.0",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.paracelsus]
base = "models:Base"
imports = ["models"]
column_sort = "preserve-order"
