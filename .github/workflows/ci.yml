name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [cicd]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-path: 'app/pyproject.toml'

      - name: Install dependencies
        working-directory: app
        run: uv sync --locked

      - name: Run unit tests
        working-directory: app
        run: uv run --locked pytest tests

